<svg
  width="800"
  height="260"
  viewBox="0 0 800 260"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Fondo -->
  <rect
    x="1"
    y="1"
    width="798"
    height="258"
    rx="24"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="2"
  />

  <!-- Imagen de perfil -->
  <defs>
    <clipPath id="avatarClip">
      <circle cx="130" cy="130" r="80" />
    </clipPath>
  </defs>

  <image
    href="profilepic.png"
    x="50"
    y="50"
    width="160"
    height="160"
    clip-path="url(#avatarClip)"
    preserveAspectRatio="xMidYMid slice"
  />

  <!-- Borde avatar -->
  <circle
    cx="130"
    cy="130"
    r="82"
    fill="none"
    stroke="#58a6ff"
    stroke-width="3"
  />

  <!-- Nombre -->
  <text
    x="250"
    y="90"
    font-family="monospace"
    font-size="40"
    font-weight="bold"
    fill="#f0f6fc"
  >
    Alvorak
  </text>

  <!-- Cursor animado -->
  <rect
    x="430"
    y="60"
    width="18"
    height="35"
    rx="2"
    fill="#3fb950"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Tagline -->
  <text
    x="250"
    y="130"
    font-family="monospace"
    font-size="20"
    fill="#58a6ff"
  >
    Compiling at int/second
  </text>

  <!-- Descripción -->
  <text
    x="250"
    y="170"
    font-family="monospace"
    font-size="16"
    fill="#8b949e"
  >
    <tspan x="250" dy="0">
      I build software and break things
    </tspan>
    <tspan x="250" dy="24">
      to understand how they work.
    </tspan>
  </text>

</svg>
